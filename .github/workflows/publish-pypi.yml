# Publishes to PyPI with trusted publishing (OIDC, no API token) when a GitHub release is published.
# One-time setup on PyPI: add a pending trusted publisher with
#   project: knoblog  owner: fitzyracing1  repository: knoblog  workflow: publish-pypi.yml  environment: pypi
# Until that exists the publish job is skipped on releases (set the repository variable PYPI_PUBLISH=true
# once the publisher is configured), and can be run by hand with "Run workflow".
name: publish-pypi
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/knoblog/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
